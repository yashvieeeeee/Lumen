[project]
name = "lumen-api"
version = "0.2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "fastapi-users[sqlalchemy]>=15,<16",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "ruff>=0.12,<1", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = [".", "../.."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# FastAPI documents Depends/Header defaults as dependency declarations.
extend-ignore = ["B008"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
